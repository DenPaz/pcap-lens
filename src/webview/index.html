<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
    Strict CSP: no inline scripts or styles, scripts only with this page's nonce,
    resources only from the extension's webview folder. Packet contents are
    untrusted and are only ever inserted with textContent.
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}}; font-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{codiconsUri}}" />
    <link rel="stylesheet" href="{{baseUri}}" />
    <link rel="stylesheet" href="{{stylesUri}}" />
    <title>PCAP Lens</title>
  </head>
  <body>
    <div id="app">
      <div id="filter-bar" role="search">
        <div id="filter-field">
          <button
            id="filter-saved"
            type="button"
            class="icon"
            title="Saved and recent filters"
            aria-label="Saved and recent filters"
            aria-haspopup="listbox"
            aria-controls="suggest"
          >
            <span class="codicon codicon-star-full" aria-hidden="true"></span>
          </button>
          <label for="filter-input" class="visually-hidden">Display filter</label>
          <input
            id="filter-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="suggest"
            placeholder="Apply a display filter … (Enter to apply, Ctrl+Space for suggestions)"
          />
          <button
            id="filter-clear"
            type="button"
            class="icon"
            title="Clear display filter"
            aria-label="Clear display filter"
          >
            <span class="codicon codicon-close" aria-hidden="true"></span>
          </button>
          <button
            id="filter-ai"
            type="button"
            class="icon hidden"
            aria-pressed="false"
            title="Ask AI for a display filter: describe the packets you want (only your text, the current filter and protocol/field names are sent)"
            aria-label="Ask AI for a display filter"
          >
            <span class="codicon codicon-sparkle" aria-hidden="true"></span>
          </button>
          <button
            id="filter-build"
            type="button"
            class="icon"
            title="Build a display filter from a field, a relation and a value"
            aria-label="Build a display filter"
            aria-haspopup="dialog"
          >
            <span class="codicon codicon-list-filter" aria-hidden="true"></span>
          </button>
          <button
            id="filter-apply"
            type="button"
            class="icon"
            title="Apply display filter (Enter)"
            aria-label="Apply display filter"
          >
            <span class="codicon codicon-arrow-right" aria-hidden="true"></span>
          </button>
          <div id="suggest" class="suggest hidden" role="listbox"></div>
        </div>
        <button
          id="filter-menu"
          type="button"
          class="icon"
          title="All PCAP commands"
          aria-label="All PCAP commands"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="commands-menu"
        >
          <span class="codicon codicon-menu" aria-hidden="true"></span>
        </button>
        <button id="filter-cancel" type="button" class="hidden" title="Cancel filtering">
          Cancel
        </button>
      </div>
      <div id="toolbar">
        <div id="nav-tools" role="toolbar" aria-label="Packet navigation"></div>
        <div id="filter-buttons" class="hidden" role="toolbar" aria-label="Filter buttons"></div>
      </div>
      <div id="find-bar" class="hidden" role="search" aria-label="Find packet">
        <select id="find-mode" aria-label="Find by">
          <option value="filter">Display filter</option>
          <option value="string">String</option>
          <option value="regex">Regular expression</option>
          <option value="hex">Hex bytes</option>
        </select>
        <select id="find-in" class="hidden" aria-label="Search in">
          <option value="bytes">Packet bytes</option>
          <option value="list">Packet list</option>
          <option value="details">Packet details</option>
        </select>
        <input
          id="find-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          aria-label="Find"
        />
        <label id="find-case-label" class="hidden"
          ><input id="find-case" type="checkbox" /> Match case</label
        >
        <button id="find-prev" type="button" title="Find previous (Shift+F3, Shift+Enter)">
          Previous
        </button>
        <button id="find-next" type="button" title="Find next (F3, Enter)">Next</button>
        <span id="find-status" role="status" aria-live="polite"></span>
        <button id="find-close" type="button" class="icon" title="Close (Esc)" aria-label="Close">
          <span class="codicon codicon-close" aria-hidden="true"></span>
        </button>
      </div>
      <div id="filter-error" class="hidden" role="alert"></div>

      <div id="main">
        <section id="list" aria-label="Packet list">
          <div id="list-header" role="row"></div>
          <div id="list-body">
            <div
              id="list-viewport"
              tabindex="0"
              role="grid"
              aria-label="Packets"
              aria-multiselectable="true"
              aria-owns="list-header"
            >
              <div id="list-spacer"></div>
              <div id="list-rows"></div>
            </div>
            <canvas
              id="list-overview"
              class="hidden"
              aria-hidden="true"
              title="Overview of the packet list: coloring rules, marked, commented and found packets (click to scroll)"
            ></canvas>
          </div>
          <div id="list-empty" class="hidden" aria-live="polite"></div>
        </section>

        <div
          id="split-h"
          class="splitter horizontal"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Resize the packet list"
          aria-valuemin="10"
          aria-valuemax="90"
          aria-valuenow="50"
          tabindex="0"
        ></div>

        <section id="bottom">
          <div id="detail" role="region" aria-label="Packet details">
            <div id="detail-head">
              <div id="detail-views" class="hidden" role="toolbar" aria-label="Packet details view">
                <button
                  id="view-tree"
                  type="button"
                  class="icon"
                  aria-pressed="true"
                  title="Show the packet's dissection tree"
                >
                  <span class="codicon codicon-list-tree" aria-hidden="true"></span>Tree
                </button>
                <button
                  id="view-diagram"
                  type="button"
                  class="icon"
                  aria-pressed="false"
                  title="Show each protocol's header as a diagram, 32 bits a row"
                >
                  <span class="codicon codicon-table" aria-hidden="true"></span>Diagram
                </button>
                <button
                  id="diagram-values"
                  type="button"
                  class="icon hidden"
                  aria-pressed="false"
                  title="Show the fields' values in the diagram"
                >
                  <span class="codicon codicon-symbol-value" aria-hidden="true"></span>Values
                </button>
              </div>
              <div id="comment-bar" class="hidden" role="group" aria-label="Packet comment">
                <div id="comment-view">
                  <span id="comment-text"></span>
                  <span
                    id="comment-edited"
                    class="hidden"
                    title="Save the capture (Ctrl+S) to keep it"
                    >unsaved</span
                  >
                  <button id="comment-edit" type="button" class="status-link">Edit</button>
                  <button id="comment-delete" type="button" class="status-link">Delete</button>
                </div>
                <div id="comment-editor" class="hidden">
                  <textarea id="comment-input" rows="3" aria-label="Packet comment"></textarea>
                  <div class="comment-actions">
                    <button id="comment-apply" type="button">Apply</button>
                    <button id="comment-cancel" type="button" class="secondary">Cancel</button>
                    <span class="hint"
                      >Ctrl+Enter applies, Esc cancels; save the capture (Ctrl+S) to keep it</span
                    >
                  </div>
                </div>
              </div>
              <div id="detail-note" class="hidden" role="status"></div>
            </div>
            <div id="detail-tree" role="tree" tabindex="0"></div>
            <div id="detail-diagram" class="hidden" role="group" aria-label="Packet diagram"></div>
            <div id="detail-placeholder" class="placeholder">
              Select a packet to see its details.
            </div>
          </div>
          <div
            id="split-v"
            class="splitter vertical"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize the packet details"
            aria-valuemin="10"
            aria-valuemax="90"
            aria-valuenow="55"
            tabindex="0"
          ></div>
          <div id="bytes" role="region" aria-label="Packet bytes">
            <div id="bytes-tabs" class="hidden" role="tablist"></div>
            <div id="bytes-view" tabindex="0"></div>
          </div>
        </section>
      </div>

      <footer id="status-bar">
        <span id="status-capture" class="hidden" role="status"
          ><span class="rec-dot" aria-hidden="true"></span><span id="capture-text"></span
          ><button id="capture-stop" type="button" class="status-link" title="Stop the capture">
            Stop
          </button></span
        >
        <span id="status-left"></span>
        <span id="status-field" class="hidden"></span>
        <span id="status-right"
          ><button id="status-expert" type="button" class="status-link hidden"></button
          ><button
            id="status-lua"
            type="button"
            class="status-link hidden"
            title="Lua dissectors for this capture (click to change)"
          ></button
          ><button
            id="status-names"
            type="button"
            class="status-link"
            title="Name resolution (click to change)"
          ></button
          ><button
            id="status-time"
            type="button"
            class="status-link"
            title="Time display format (click to change)"
          ></button
          ><span id="status-info"></span
        ></span>
      </footer>

      <div id="overlay" class="overlay">
        <div class="overlay-box">
          <div id="overlay-message">Loading…</div>
          <div id="overlay-progress" class="progress"><div id="overlay-progress-fill"></div></div>
          <div id="overlay-detail"></div>
          <div class="overlay-actions">
            <button id="overlay-cancel" type="button">Cancel</button>
            <button id="overlay-reload" type="button" class="hidden">Reload</button>
            <button id="overlay-log" type="button" class="hidden secondary">Show Log</button>
          </div>
        </div>
      </div>

      <div id="context-menu" class="context-menu hidden" role="menu"></div>

      <div
        id="shortcuts"
        class="hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="shortcuts-title"
      >
        <div class="dialog-box">
          <div class="dialog-head">
            <h2 id="shortcuts-title">Keyboard Shortcuts</h2>
            <button
              id="shortcuts-close"
              type="button"
              class="icon"
              title="Close (Esc)"
              aria-label="Close"
            >
              <span class="codicon codicon-close" aria-hidden="true"></span>
            </button>
          </div>
          <div id="shortcuts-body" tabindex="0" aria-label="Shortcuts"></div>
        </div>
      </div>
      <div
        id="builder"
        class="hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="builder-title"
      >
        <div class="dialog-box">
          <div class="dialog-head">
            <h2 id="builder-title">Build a Display Filter</h2>
            <button
              id="builder-close"
              type="button"
              class="icon"
              title="Close (Esc)"
              aria-label="Close"
            >
              <span class="codicon codicon-close" aria-hidden="true"></span>
            </button>
          </div>
          <div id="builder-body">
            <label for="builder-search">Field</label>
            <input
              id="builder-search"
              type="text"
              spellcheck="false"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="builder-fields"
              placeholder="Search by name or description, e.g. ttl or time to live"
            />
            <div
              id="builder-fields"
              class="builder-list hidden"
              role="listbox"
              aria-label="Fields"
            ></div>
            <p id="builder-field" class="builder-note">Pick a field to filter on.</p>
            <label for="builder-op">Relation</label>
            <select id="builder-op" disabled></select>
            <label for="builder-value">Value</label>
            <input id="builder-value" type="text" spellcheck="false" autocomplete="off" disabled />
            <div id="builder-values-head" class="builder-note hidden">
              <span id="builder-values-status"></span>
              <button id="builder-values-stop" type="button" class="link hidden">Stop</button>
            </div>
            <div
              id="builder-values"
              class="builder-list hidden"
              role="listbox"
              aria-label="Values seen in this capture"
            ></div>
            <label for="builder-combine">With the filter in the bar</label>
            <select id="builder-combine">
              <option value="replace">Replace it</option>
              <option value="and">Both (and)</option>
              <option value="or">Either (or)</option>
              <option value="not">And not this</option>
            </select>
            <div class="builder-preview-row">
              <span>Filter:</span>
              <code id="builder-preview"></code>
            </div>
            <p id="builder-error" class="builder-note" role="status"></p>
          </div>
          <div class="dialog-buttons">
            <button id="builder-apply" type="button" disabled>Apply</button>
            <button id="builder-insert" type="button" class="secondary" disabled>
              Put in Filter Bar
            </button>
            <button id="builder-cancel" type="button" class="secondary">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <script nonce="{{nonce}}" src="{{libUri}}"></script>
    <script type="module" nonce="{{nonce}}" src="{{mainUri}}"></script>
  </body>
</html>
