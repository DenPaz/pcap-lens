name: Real captures

# Every backend feature over Wireshark's and tcpdump's own test captures
# (test/realworld/run.py, what `make realworld` runs by hand): weekly, and by
# hand. Linux has the distribution's tshark, macOS Homebrew's (the newest
# release, which most users run). One job per system and source, and two for
# Wireshark's set on macOS: it grew to 1,602 captures (3 h on Linux, two at a
# time; macOS, one at a time, reached 1,418 in 6 h). A capture with a problem fails
# the job; the run's summary lists them and the artifact has every step. The
# captures stay in the Actions cache, never in the repository or an artifact
# (they aren't ours to redistribute).

on:
  schedule:
    - cron: "41 3 * * 1" # Mondays, 03:41 UTC
  workflow_dispatch:
    inputs:
      full:
        description: Every step for Wireshark's captures (not only the quick ones)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: realworld-${{ github.ref }}
  cancel-in-progress: false

jobs:
  realworld:
    name: ${{ matrix.name }}, ${{ matrix.source }}${{ matrix.part && format(' ({0})', matrix.part) || '' }}
    # (A fork's schedule would download every capture for nothing.)
    if: github.event_name == 'workflow_dispatch' || github.repository == 'DenPaz/pcap-lens'
    runs-on: ${{ matrix.os }}
    # (GitHub's limit for hosted runners: macOS took 4 h 26 for Wireshark's set alone.)
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # macOS runs one capture at a time: Wireshark's set (1,602 captures)
      # reached 1,418 in GitHub's 6 hours, so it runs in two parts (--part).
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux (distribution tshark), source: wireshark }
          - { os: ubuntu-latest, name: Linux (distribution tshark), source: tcpdump }
          - { os: macos-latest, name: macOS (Homebrew tshark), source: wireshark, part: 1/2 }
          - { os: macos-latest, name: macOS (Homebrew tshark), source: wireshark, part: 2/2 }
          - { os: macos-latest, name: macOS (Homebrew tshark), source: tcpdump }
    steps:
      - uses: actions/checkout@v7
      - name: Install tshark (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          # Ubuntu 26.04 confines tshark with AppArmor: the local rules of the
          # backend's hint (sandbox.py), so it reads the captures under ~/.cache.
          if [ -f /etc/apparmor.d/tshark ]; then
            printf '%s\n' 'owner @{HOME}/** rw,' 'signal (receive) peer=unconfined,' | sudo tee -a /etc/apparmor.d/local/tshark
            sudo apparmor_parser -r /etc/apparmor.d/tshark
          fi
      - name: Install Wireshark (macOS)
        if: runner.os == 'macOS'
        run: brew install --formula wireshark
      - name: tshark version
        run: |
          tshark --version
          # (How a crash is handled: a crash handler such as apport keeps a
          # crashed tshark around while it reads the core.)
          if [ -r /proc/sys/kernel/core_pattern ]; then echo "core_pattern: $(cat /proc/sys/kernel/core_pattern)"; fi
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      # Downloaded once, then kept: each run saves under a new key and restores the
      # latest (a key from before the split per source holds both). Restore and
      # save are separate steps, since actions/cache only saves when the job
      # succeeds, and a run that finds problems fails.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pcap-lens-realworld
          key: realworld-captures-${{ runner.os }}-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: |
            realworld-captures-${{ runner.os }}-${{ matrix.source }}-
            realworld-captures-${{ runner.os }}-
      - name: The captures
        id: captures
        continue-on-error: true
        shell: bash
        env:
          FULL: ${{ inputs.full }}
          SOURCE: ${{ matrix.source }}
          PART: ${{ matrix.part }}
        run: |
          # (Every step for Wireshark's only by hand with "full"; tcpdump's are
          # many small fuzzed ones, always the quick steps.)
          quick=--quick
          if [ "$FULL" = "true" ] && [ "$SOURCE" = wireshark ]; then quick=; fi
          part=()
          if [ -n "$PART" ]; then part=(--part "$PART"); fi
          uv run python -u test/realworld/run.py --fetch "$SOURCE" $quick "${part[@]}" --out "$SOURCE.json" 2>&1 | tee "$SOURCE.log"
      - name: Summary
        if: always()
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          SOURCE: ${{ matrix.source }}
          PART: ${{ matrix.part }}
        run: |
          {
            echo "## Real captures on ${NAME}: ${SOURCE} ${PART}"
            echo
            echo '```'
            tshark --version | head -n 1
            echo '```'
            echo
            echo '```'
            # The problems, then the totals (the harness prints them last).
            grep -A 3 '^PROBLEM' "${SOURCE}.log" | head -n 200 || true
            sed -n '/^[0-9]* captures, [0-9]* with problems/,$p' "${SOURCE}.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # (Both macOS parts hold the same captures: the first part saves them.)
      - uses: actions/cache/save@v6
        if: always() && matrix.part != '2/2'
        with:
          path: ~/.cache/pcap-lens-realworld
          key: realworld-captures-${{ runner.os }}-${{ matrix.source }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: realworld-${{ runner.os }}-${{ matrix.source }}${{ matrix.part && format('-part{0}', matrix.part == '1/2' && '1' || '2') || '' }}
          path: ${{ matrix.source }}.json
          if-no-files-found: ignore
      - name: Fail on problems
        if: steps.captures.outcome == 'failure'
        run: |
          echo "::error::The harness found problems (see the run's summary and report.json)"
          exit 1
