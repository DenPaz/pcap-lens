name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # The release workflow runs everything here first (release.yml).
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (lint, backend, unit, webview e2e, VS Code smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark xvfb
          # Ubuntu 26.04 confines tshark with AppArmor (/etc/apparmor.d/tshark):
          # apply the local rules the backend's hint suggests (sandbox.py), so it
          # reads the fixtures in the checkout and the tests can stop it.
          if [ -f /etc/apparmor.d/tshark ]; then
            printf '%s\n' 'owner @{HOME}/** rw,' 'signal (receive) peer=unconfined,' | sudo tee -a /etc/apparmor.d/local/tshark
            sudo apparmor_parser -r /etc/apparmor.d/tshark
          fi
          # Let dumpcap capture (the loopback live-capture test), as
          # dpkg-reconfigure wireshark-common would for the wireshark group.
          sudo setcap cap_net_raw,cap_net_admin=eip /usr/bin/dumpcap
      # Python 3.14 (.python-version) on PATH for the extension and for uv's
      # dev venv; the python-3.12 job below covers the oldest supported one.
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # (pnpm's version comes from package.json "packageManager")
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: |
          pnpm run lint
          pnpm run format:check
          uv run ruff check
          uv run ruff format --check
          uv run mypy
          uv run mypy --python-version 3.14
      - name: Backend tests
        run: uv run pytest
      - name: Install Chromium for webview e2e
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Unit + webview tests
        run: pnpm run test:unit
      - name: VS Code smoke test
        run: xvfb-run -a pnpm run test:extension
      - name: Package
        run: pnpm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  # The backend supports Python 3.12+ (pyproject.toml requires-python,
  # MIN_PYTHON in src/backendClient.ts): run it on the oldest one too.
  python-3-12:
    name: Linux, Python 3.12 (backend, unit, webview e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7
      - name: Install tshark
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
          if [ -f /etc/apparmor.d/tshark ]; then # see the Linux job
            printf '%s\n' 'owner @{HOME}/** rw,' 'signal (receive) peer=unconfined,' | sudo tee -a /etc/apparmor.d/local/tshark
            sudo apparmor_parser -r /etc/apparmor.d/tshark
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Python version
        run: uv run python --version
      - name: Backend tests
        run: uv run pytest
      - name: Install Chromium for webview e2e
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Unit + webview tests (backend on Python 3.12)
        run: pnpm run test:unit

  cross-platform:
    name: ${{ matrix.os }} (backend, unit, webview e2e, VS Code smoke)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # tshark, capinfos, editcap and mergecap, so the tshark tests run here too.
      - name: Install Wireshark (macOS)
        if: runner.os == 'macOS'
        run: brew install --formula wireshark
      - name: Install Wireshark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wireshark -y --no-progress
          "C:\Program Files\Wireshark" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: tshark version
        run: tshark --version
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: Backend tests
        run: uv run pytest
      - name: Install Chromium for webview e2e
        run: pnpm exec playwright-core install chromium
      - name: Unit + webview tests
        run: pnpm run test:unit
      - name: VS Code smoke test
        run: pnpm run test:extension
