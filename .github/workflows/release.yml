name: Release

# Push a tag made by `node scripts/release.mjs prepare <version>` (v<version>):
# CI runs on the tag, then the .vsix is attached to a GitHub release whose
# notes are that version's CHANGELOG section. It is also published to the
# VS Code Marketplace and Open VSX when the VSCE_PAT / OVSX_PAT secrets exist.
# Running it by hand (workflow_dispatch) on a tag retries a failed release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag names main's merge commit, which CI already tested when it was
  # pushed: reuse that run (waiting for it while it is still going) instead of
  # testing the same commit again. Without a green one, CI runs here.
  tested:
    name: CI already passed on this commit?
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
            --jq '.workflow_runs[0] | select(.) | "\(.id) \(.status) \(.conclusion)"')
          read -r id status conclusion <<< "$run"
          if [ -n "$id" ] && [ "$status" != completed ]; then
            echo "CI run $id is still going: waiting for it"
            if gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null; then
              conclusion=success
            else
              conclusion=failure
            fi
          fi
          if [ "$conclusion" = success ]; then
            echo "::notice::CI passed on $SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
            echo "run=$id" >> "$GITHUB_OUTPUT"
          else
            echo "No green CI run of $SHA (${conclusion:-none}): running CI here"
          fi

  ci:
    needs: tested
    if: needs.tested.outputs.run == ''
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release and Marketplace
    needs: [tested, ci]
    # (ci is skipped when the tested job found a green run)
    if: ${{ !cancelled() && needs.tested.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload the .vsix
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Only tags are released
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Run this workflow on a tag (v<major>.<minor>.<patch>), not on ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag, package.json and CHANGELOG agree
        run: node scripts/release.mjs check "$TAG"
      - name: Package
        run: |
          pnpm run package
          echo "VSIX=$(ls pcap-viewer-*.vsix)" >> "$GITHUB_ENV"
          node scripts/release.mjs notes > "$RUNNER_TEMP/notes.md"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" --verify-tag \
              --title "PCAP Lens ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT is not set: not published to the VS Code Marketplace."
            exit 0
          fi
          pnpm exec vsce publish --no-dependencies --skip-duplicate --packagePath "$VSIX"
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::OVSX_PAT is not set: not published to Open VSX."
            exit 0
          fi
          npx --yes ovsx@1.2.0 publish --skip-duplicate --packagePath "$VSIX"
